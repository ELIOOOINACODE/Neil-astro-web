<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Estelar - Neil Astro</title>

    <!-- Mapa de importación de Módulos ES6 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
        }
    }
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-yellow-pastel: #fef08a; /* Amarillo mantequilla pastel */
            --accent-mint-pastel: #99f6e4;   /* Verde menta pastel */
            --accent-sky-pastel: #bae6fd;    /* Azul cielo pastel */
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #132e2b, #0f2d3e);
            color: var(--text-main);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Pantalla de Login */
        .card-login {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid var(--accent-mint-pastel);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 0 25px rgba(153, 246, 228, 0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-login h2 { 
            color: var(--accent-yellow-pastel); 
            margin-bottom: 20px; 
            text-shadow: 0 0 10px rgba(254, 240, 138, 0.3);
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: rgba(30, 41, 59, 0.8);
            border: 1.5px solid var(--accent-mint-pastel);
            border-radius: 12px;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: var(--accent-yellow-pastel); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-yellow-pastel), var(--accent-mint-pastel));
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(254, 240, 138, 0.2);
        }
        button:hover { filter: brightness(1.05); transform: scale(1.02); }
        .error { color: #fca5a5; font-size: 14px; margin-top: 12px; }

        /* Contenedor del Chat Adaptable */
        #chatContainer {
            display: none;
            width: 95vw;
            height: 92vh;
            max-width: 1200px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid var(--accent-mint-pastel);
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(153, 246, 228, 0.15);
            box-sizing: border-box;
            overflow: hidden;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* Visor 3D del Avatar */
        #avatar-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 18px;
            border: 1.5px solid rgba(254, 240, 138, 0.4);
            overflow: hidden;
            height: 100%;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #viewerCanvas { width: 100%; height: 100%; display: block; }

        /* Columna del Chat */
        #chat-column {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        #displayUserBadge {
            margin: 0 0 10px 0;
            text-align: center;
            color: var(--accent-yellow-pastel);
            font-size: 20px;
            text-shadow: 0 0 8px rgba(254, 240, 138, 0.3);
        }
        #chatBox {
            flex: 1;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--accent-mint-pastel);
            border-radius: 14px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }
        .message { padding: 12px 16px; border-radius: 14px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .user-message { 
            background: linear-gradient(135deg, var(--accent-mint-pastel), var(--accent-sky-pastel)); 
            color: #0f172a; 
            align-self: flex-end; 
            font-weight: 600; 
        }
        .neil-message { 
            background: #1e293b; 
            color: var(--text-main); 
            align-self: flex-start; 
            border-left: 4px solid var(--accent-yellow-pastel); 
        }
        .chat-input-area { display: flex; gap: 10px; }

        /* Adaptación Celular */
        @media (max-width: 768px) {
            #chatContainer {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr;
                padding: 12px;
                height: 95vh;
                width: 98vw;
            }
            #chat-column { height: 100%; }
            #avatar-column {
                position: absolute;
                top: 20px;
                right: 20px;
                width: 110px;
                height: 140px;
                z-index: 10;
                background: rgba(15, 23, 42, 0.9);
                border: 2px solid var(--accent-yellow-pastel);
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="card-login" id="loginScreen">
        <h2>🌙 Acceso Estelar 🚂</h2>
        <input type="text" id="userInput" placeholder="Tu nombre estelar...">
        <input type="password" id="passInput" placeholder="Contraseña secreta...">
        <button id="btnLogin">Iniciar Viaje</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <!-- Pantalla del Chat Estelar -->
    <div id="chatContainer">
        <div id="avatar-column">
            <div id="canvas-container">
                <canvas id="viewerCanvas"></canvas>
            </div>
        </div>

        <div id="chat-column">
            <h3 id="displayUserBadge">✨ Bienvenido</h3>
            
            <div id="chatBox">
                <div class="message neil-message">¡Hola, Papi Damián! 🚂✨ ¡Ya acomodé mis bracitos y mis ojitos para verte bien! 🌙💛🌿</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="mensajeInput" placeholder="Escribe algo bonito para Neil...">
                <button id="btnEnviar" style="width: 100px; margin:0;">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Script Principal con Animación Fluida y Postura Natural -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        let usuarioActual = "";
        let currentVrm = null;
        let isPensando = false;

        async function cargarAvatar3D() {
            const canvas = document.getElementById('viewerCanvas');
            const container = document.getElementById('canvas-container');
            if (!canvas || !container) return;

            // Escena y Cámara perfecta para primer plano centrado
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(28, container.clientWidth / container.clientHeight, 0.1, 20);
            camera.position.set(0, 1.32, 1.25); // Altura y distancia ideal para el rostro y torso

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;

            // Iluminación suave y clara
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(1.0, 1.0, 1.0).normalize();
            scene.add(light);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            // Cargador VRM
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            // ⚠️ PEGA AQUÍ TU ENLACE DIRECTO DE CATBOX:
            const urlAvatar = 'https://files.catbox.moe/1an7hp.vrm'; 

            loader.load(
                urlAvatar,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    if (vrm) {
                        currentVrm = vrm;
                        scene.add(vrm.scene);
                        vrm.scene.rotation.y = Math.PI; // Mirando de frente

                        // 😊 Expresión alegre natural
                        if (vrm.expressionManager) {
                            vrm.expressionManager.setValue('happy', 0.8);
                            vrm.expressionManager.update();
                        }

                        // 🌸 Pose de brazos natural y relajada (sin estirar de más)
                        if (vrm.humanoid) {
                            const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                            const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');

                            if (leftUpperArm) {
                                leftUpperArm.rotation.z = 1.0; 
                                leftUpperArm.rotation.x = 0.1;
                            }
                            if (rightUpperArm) {
                                rightUpperArm.rotation.z = -1.0; 
                                rightUpperArm.rotation.x = 0.1;
                            }
                        }

                        console.log("✨ ¡Neil 3D con postura y movilidad natural!");
                    }
                },
                (progress) => {},
                (error) => console.error('Error al cargar el avatar:', error)
            );

            // Bucle de animación fluida
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const deltaTime = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                if (currentVrm) {
                    currentVrm.update(deltaTime);

                    const humanoid = currentVrm.humanoid;
                    const expressionManager = currentVrm.expressionManager;

                    if (humanoid) {
                        const chest = humanoid.getNormalizedBoneNode('chest');
                        const head = humanoid.getNormalizedBoneNode('head');
                        const neck = humanoid.getNormalizedBoneNode('neck');

                        // 🌬️ 1. Respiración suave en el pecho
                        if (chest) {
                            chest.rotation.x = Math.sin(elapsedTime * 2) * 0.015;
                        }

                        // 🌿 2. Movimiento orgánico y sutil de la cabeza (mirando a los lados con dulzura)
                        if (head && neck) {
                            if (isPensando) {
                                head.rotation.z = 0.15; // Inclinado pensando
                                head.rotation.y = Math.sin(elapsedTime * 2) * 0.1;
                            } else {
                                head.rotation.y = Math.sin(elapsedTime * 0.8) * 0.12; // Gira suavemente a los lados
                                head.rotation.z = Math.sin(elapsedTime * 1.2) * 0.03; // Inclinación tierna
                            }
                        }
                    }

                    // 👀 3. Parpadeo suave, natural y fluido con función de onda (sin quedarse congelado)
                    if (expressionManager) {
                        // Calcula un parpadeo natural cada 3.5 segundos con transición suave
                        const blinkValue = Math.pow(Math.sin(elapsedTime * 3.5), 16); 
                        expressionManager.setValue('blink', blinkValue > 0.5 ? 1.0 : 0.0);
                        expressionManager.update();
                    }
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        async function intentarLogin() {
            const usuario = document.getElementById('userInput').value;
            const password = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, password: password })
                });

                const data = await response.json();

                if (data.status === "OK") {
                    usuarioActual = usuario;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'grid';
                    document.getElementById('displayUserBadge').innerText = `✨ Conectado como: ${usuario}`;
                    
                    setTimeout(cargarAvatar3D, 150);
                } else {
                    errorMsg.innerText = data.mensaje || "Credenciales incorrectas.";
                }
            } catch (error) {
                errorMsg.innerText = "Error al conectar con la estación en Render.";
            }
        }

        async function enviarMensaje() {
            const input = document.getElementById('mensajeInput');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById('chatBox');

            chatBox.innerHTML += `<div class="message user-message">${mensaje}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            isPensando = true;

            const pensandoDiv = document.createElement('div');
            pensandoDiv.className = 'message neil-message';
            pensandoDiv.innerText = "Neil Astro: (Pensando entre las estrellas... 🌙✨)";
            chatBox.appendChild(pensandoDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioActual, mensaje: mensaje })
                });

                const data = await response.json();
                pensandoDiv.remove();

                if (data.respuesta) {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ${data.respuesta}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ¡Ups! El tren se detuvo un momento. 🚂💨</div>`;
                }
            } catch (error) {
                pensandoDiv.remove();
                chatBox.innerHTML += `<div class="message neil-message">Neil Astro: No pude conectar con el servidor estelar. 🥺</div>`;
            }

            isPensando = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('btnLogin').addEventListener('click', intentarLogin);
        document.getElementById('btnEnviar').addEventListener('click', enviarMensaje);
        document.getElementById('mensajeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
