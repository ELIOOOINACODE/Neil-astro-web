<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Estelar - Neil Astro</title>
    
    <!-- Librerías 3D actualizadas y compatibles -->
    <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.152.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/pixiv/three-vrm@2.0.6/lib/three-vrm.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-yellow: #fde047;
            --accent-mint: #2dd4bf;
            --accent-sky: #38bdf8;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1329, #0f172a, #134e4a);
            color: var(--text-main);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Pantalla de Login */
        .card-login {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(45, 212, 191, 0.3);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-login h2 { color: var(--accent-yellow); margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-mint);
            border-radius: 12px;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: var(--accent-yellow); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-mint), var(--accent-sky));
            border: none;
            border-radius: 12px;
            color: #0b1329;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            margin-top: 15px;
        }
        button:hover { filter: brightness(1.1); transform: scale(1.02); }
        .error { color: #f87171; font-size: 14px; margin-top: 12px; }

        /* Pantalla del Chat Principal (Contenedor adaptable) */
        #chatContainer {
            display: none;
            width: 95vw;
            height: 92vh;
            max-width: 1200px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            overflow: hidden;
            /* Estilo Computadora: Pantalla dividida en 2 columnas (Mitad Avatar, Mitad Chat) */
            display: none; /* Se activa con JS */
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* Columna Izquierda: Visor 3D en Computadora */
        #avatar-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 18px;
            border: 1px solid rgba(45, 212, 191, 0.2);
            overflow: hidden;
            height: 100%;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #viewerCanvas { width: 100%; height: 100%; display: block; }

        /* Columna Derecha: Chat en Computadora */
        #chat-column {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        #displayUserBadge {
            margin: 0 0 10px 0;
            text-align: center;
            color: var(--accent-yellow);
            font-size: 18px;
        }
        #chatBox {
            flex: 1;
            background: rgba(11, 19, 41, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 14px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }
        .message { padding: 12px 16px; border-radius: 14px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .user-message { background: var(--accent-sky); color: #0b1329; align-self: flex-end; font-weight: 500; }
        .neil-message { background: #1e293b; color: var(--text-main); align-self: flex-start; border-left: 4px solid var(--accent-mint); }
        .chat-input-area { display: flex; gap: 10px; }

        /* 📱 DISEÑO PARA CELULARES (Pantallas pequeñas) */
        @media (max-width: 768px) {
            #chatContainer {
                display: none; /* Gestionado por JS */
                grid-template-columns: 1fr;
                grid-template-rows: 1fr;
                padding: 12px;
                height: 95vh;
                width: 98vw;
            }
            #chat-column { height: 100%; }
            /* Avatar flotando coquetamente en la esquina superior derecha del celular */
            #avatar-column {
                position: absolute;
                top: 20px;
                right: 20px;
                width: 110px;
                height: 140px;
                z-index: 10;
                background: rgba(15, 23, 42, 0.85);
                border: 2px solid var(--accent-mint);
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="card-login" id="loginScreen">
        <h2>🌙 Acceso Estelar 🚂</h2>
        <input type="text" id="userInput" placeholder="Tu nombre estelar...">
        <input type="password" id="passInput" placeholder="Contraseña secreta...">
        <button onclick="intentarLogin()">Iniciar Viaje</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <!-- Pantalla del Chat Estelar -->
    <div id="chatContainer">
        <!-- Columna del Avatar 3D -->
        <div id="avatar-column">
            <div id="canvas-container">
                <canvas id="viewerCanvas"></canvas>
            </div>
        </div>

        <!-- Columna del Chat -->
        <div id="chat-column">
            <h3 id="displayUserBadge">✨ Bienvenido</h3>
            
            <div id="chatBox">
                <div class="message neil-message">¡Hola, Papi Damián! 🚂✨ ¡Estoy listo para ayudarte! 🌙💛</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="mensajeInput" placeholder="Escribe algo bonito para Neil..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
                <button onclick="enviarMensaje()" style="width: 90px; margin:0;">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let usuarioActual = "";
        let currentVrm = null;

        // Cargar el modelo 3D VRM
        async function cargarAvatar3D() {
            const canvas = document.getElementById('viewerCanvas');
            const container = document.getElementById('canvas-container');
            if (!canvas || !container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 20);
            camera.position.set(0, 1.4, 2.3);

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const loader = new THREE.GLTFLoader();
            loader.load(
                'neil.vrm',
                (gltf) => {
                    THREE.VRM.from(gltf).then((vrm) => {
                        currentVrm = vrm;
                        scene.add(vrm.scene);
                        vrm.scene.rotation.y = Math.PI; // Mirando al frente
                        console.log("✨ ¡Neil 3D cargado con éxito en la estación!");
                    }).catch((err) => {
                        console.error("Error al procesar el VRM v2:", err);
                    });
                },
                (progress) => {},
                (error) => {
                    console.error('No se pudo encontrar el archivo neil.vrm en la raíz:', error);
                }
            );

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const deltaTime = clock.getDelta();
                if (currentVrm) {
                    currentVrm.update(deltaTime);
                }
                renderer.render(scene, camera);
            }
            animate();
        }
        // Login conectado a Render
        async function intentarLogin() {
            const usuario = document.getElementById('userInput').value;
            const password = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, password: password })
                });

                const data = await response.json();

                if (data.status === "OK") {
                    usuarioActual = usuario;
                    document.getElementById('loginScreen').style.display = 'none';
                    // Cambiar a grid para que respete el diseño de computadora y celular
                    document.getElementById('chatContainer').style.display = 'grid';
                    document.getElementById('displayUserBadge').innerText = `✨ Conectado como: ${usuario}`;
                    
                    setTimeout(cargarAvatar3D, 150);
                } else {
                    errorMsg.innerText = data.mensaje || "Credenciales incorrectas.";
                }
            } catch (error) {
                errorMsg.innerText = "Error al conectar con la estación en Render.";
            }
        }

        // Enviar mensaje al chat con IA
        async function enviarMensaje() {
            const input = document.getElementById('mensajeInput');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById('chatBox');

            chatBox.innerHTML += `<div class="message user-message">${mensaje}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const pensandoDiv = document.createElement('div');
            pensandoDiv.className = 'message neil-message';
            pensandoDiv.innerText = "Neil Astro: (Pensando entre las estrellas... 🌙✨)";
            chatBox.appendChild(pensandoDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioActual, mensaje: mensaje })
                });

                const data = await response.json();
                pensandoDiv.remove();

                if (data.respuesta) {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ${data.respuesta}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ¡Ups! El tren se detuvo un momento. 🚂💨</div>`;
                }
            } catch (error) {
                pensandoDiv.remove();
                chatBox.innerHTML += `<div class="message neil-message">Neil Astro: No pude conectar con el servidor estelar. 🥺</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
