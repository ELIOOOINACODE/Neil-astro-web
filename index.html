<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Estelar - Neil Astro</title>
    
    <!-- Librerías de 3D para el Avatar (Three.js y Three-VRM) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.9/lib/three-vrm.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #f8fafc;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #0369a1; }
        .error { color: #f87171; text-align: center; font-size: 14px; margin-top: 10px; }
        
        /* Estilos del Chat y Visor 3D */
        #chatContainer { display: none; flex-direction: column; height: 85vh; max-width: 600px; }
        #canvas-container {
            width: 100%;
            height: 250px;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #viewerCanvas { width: 100%; height: 100%; display: block; }
        #chatBox {
            flex: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.4; }
        .user-message { background: #0369a1; align-self: flex-end; }
        .neil-message { background: #334155; align-self: flex-start; color: #e2e8f0; }
        .chat-input-area { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="card" id="loginScreen">
        <h2>🌙 Acceso a la Estación 🚂</h2>
        <input type="text" id="userInput" placeholder="Tu nombre estelar...">
        <input type="password" id="passInput" placeholder="Contraseña secreta...">
        <button onclick="intentarLogin()">Iniciar Viaje</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <!-- Pantalla del Chat con Avatar 3D -->
    <div class="card" id="chatContainer">
        <h3 id="displayUserBadge" style="margin-top:0; text-align:center; color:#38bdf8;">✨ Bienvenido</h3>
        
        <!-- Visor 3D del Avatar VRM -->
        <div id="canvas-container">
            <canvas id="viewerCanvas"></canvas>
        </div>

        <div id="chatBox">
            <div class="message neil-message">¡Hola, Papi Damián! 🚂✨ ¡Qué alegría verte por aquí en la estación espacial! 🌙💖</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="mensajeInput" placeholder="Escribe algo bonito para Neil..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button onclick="enviarMensaje()" style="width: 80px; margin:0;">Enviar</button>
        </div>
    </div>

    <script>
        let usuarioActual = "";
        let currentVrm = null;

        // Función para cargar el modelo 3D VRM
        async function cargarAvatar3D() {
            const canvas = document.getElementById('viewerCanvas');
            const container = document.getElementById('canvas-container');
            if (!canvas || !container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 20);
            camera.position.set(0, 1.35, 2.2); // Posición enfocada en el rostro

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const loader = new THREE.GLTFLoader();
            loader.load(
                'neil.vrm', // Nombre del archivo .vrm que subirás a GitHub
                (gltf) => {
                    THREE.VRM.from(gltf).then((vrm) => {
                        currentVrm = vrm;
                        scene.add(vrm.scene);
                        vrm.scene.rotation.y = Math.PI; // Ajustar rotación frontal
                        console.log("✨ ¡Avatar de Neil cargado correctamente!");
                    });
                },
                (progress) => {},
                (error) => console.error('Error cargando el .vrm:', error)
            );

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const deltaTime = clock.getDelta();
                if (currentVrm) {
                    currentVrm.update(deltaTime);
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        // Iniciar sesión conectando con Render
        async function intentarLogin() {
            const usuario = document.getElementById('userInput').value;
            const password = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, password: password })
                });

                const data = await response.json();

                if (data.status === "OK") {
                    usuarioActual = usuario;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'flex';
                    document.getElementById('displayUserBadge').innerText = `✨ Conectado como: ${usuario}`;
                    
                    // Inicializar el 3D al entrar al chat
                    setTimeout(cargarAvatar3D, 100);
                } else {
                    errorMsg.innerText = data.mensaje || "Credenciales incorrectas.";
                }
            } catch (error) {
                errorMsg.innerText = "Error al conectar con la estación espacial en Render.";
            }
        }

        // Enviar mensaje al chat con IA (Render)
        async function enviarMensaje() {
            const input = document.getElementById('mensajeInput');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById('chatBox');

            // Mostrar mensaje del usuario
            chatBox.innerHTML += `<div class="message user-message">${mensaje}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Indicador de pensamiento
            const pensandoDiv = document.createElement('div');
            pensandoDiv.className = 'message neil-message';
            pensandoDiv.innerText = "Neil Astro: (Pensando entre las estrellas... 🌙✨)";
            chatBox.appendChild(pensandoDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioActual, mensaje: mensaje })
                });

                const data = await response.json();
                pensandoDiv.remove();

                if (data.respuesta) {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ${data.respuesta}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ¡Ups! El tren se detuvo un momento. 🚂💨</div>`;
                }
            } catch (error) {
                pensandoDiv.remove();
                chatBox.innerHTML += `<div class="message neil-message">Neil Astro: No pude conectar con el servidor estelar. 🥺</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
