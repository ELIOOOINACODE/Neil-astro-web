<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Estelar - Neil Astro</title>

    <!-- Mapa de importación de Módulos ES6 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
        }
    }
    </script>

    <style>
        :root {
            --bg-color-1: #fef9c3; /* Amarillo mantequilla pastel */
            --bg-color-2: #ccfbf1; /* Menta pastel */
            --bg-color-3: #e0f2fe; /* Azul cielo pastel */
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent-yellow: #fde047;
            --accent-mint: #5eead4;
            --accent-sky: #38bdf8;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            color: var(--text-dark);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Pantalla de Login Pastel */
        .card-login {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 2.5px solid #a7f3d0;
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(153, 246, 228, 0.4);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-login h2 { 
            color: #0d9488; 
            margin-bottom: 20px; 
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--accent-mint);
            border-radius: 14px;
            color: var(--text-dark);
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fef08a, #99f6e4);
            border: none;
            border-radius: 14px;
            color: #0f766e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(94, 234, 212, 0.3);
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .error { color: #f43f5e; font-size: 14px; margin-top: 12px; }

        /* Contenedor del Chat Pastel */
        #chatContainer {
            display: none;
            width: 95vw;
            height: 92vh;
            max-width: 1200px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 2.5px solid #a7f3d0;
            border-radius: 28px;
            box-shadow: 0 10px 35px rgba(153, 246, 228, 0.3);
            box-sizing: border-box;
            overflow: hidden;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* Visor 3D del Avatar */
        #avatar-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(224, 242, 254, 0.5);
            border-radius: 22px;
            border: 2px solid #7dd3fc;
            overflow: hidden;
            height: 100%;
        }
        #canvas-container { width: 100%; height: 100%; position: relative; }
        #viewerCanvas { width: 100%; height: 100%; display: block; }

        /* Columna del Chat */
        #chat-column { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        #displayUserBadge { 
            margin: 0 0 10px 0; 
            text-align: center; 
            color: #0d9488; 
            font-size: 20px; 
            font-weight: 700;
        }
        #chatBox {
            flex: 1;
            background: rgba(255, 255, 255, 0.75);
            border: 2px solid #bae6fd;
            border-radius: 18px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }
        .message { padding: 12px 16px; border-radius: 16px; max-width: 85%; line-height: 1.6; font-size: 15px; word-break: break-word; }
        .user-message { 
            background: linear-gradient(135deg, #bae6fd, #99f6e4); 
            color: #0f172a; 
            align-self: flex-end; 
            font-weight: 600; 
            box-shadow: 0 2px 8px rgba(186, 230, 253, 0.4);
        }
        .neil-message { 
            background: #ffffff; 
            color: var(--text-dark); 
            align-self: flex-start; 
            border-left: 5px solid #fde047; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .neil-message strong { color: #0d9488; }

        .chat-input-area { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="card-login" id="loginScreen">
        <h2>🌙 Acceso Estelar 🚂</h2>
        <input type="text" id="userInput" placeholder="Tu nombre estelar...">
        <input type="password" id="passInput" placeholder="Contraseña secreta...">
        <button id="btnLogin">Iniciar Viaje</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <div id="chatContainer">
        <div id="avatar-column">
            <div id="canvas-container">
                <canvas id="viewerCanvas"></canvas>
            </div>
        </div>

        <div id="chat-column">
            <h3 id="displayUserBadge">✨ Bienvenido</h3>
            <div id="chatBox">
                <!-- El mensaje de saludo inicial se llena automáticamente según el usuario -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="mensajeInput" placeholder="Escribe algo bonito para Neil...">
                <button id="btnEnviar" style="width: 100px; margin:0;">Enviar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        let usuarioActual = "";
        let currentVrm = null;
        let isPensando = false;

        function formatearTextoNeil(texto) {
            if (!texto) return "";
            let limpio = texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            limpio = limpio.replace(/\n/g, '<br>');
            return limpio;
        }

        async function cargarAvatar3D() {
            const canvas = document.getElementById('viewerCanvas');
            const container = document.getElementById('canvas-container');
            if (!canvas || !container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 20);
            camera.position.set(0, 1.0, 1.25); 

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;

            // Iluminación suave y realista equilibrada
            const light = new THREE.DirectionalLight(0xffffff, 0.7);
            light.position.set(1.0, 1.5, 1.0).normalize();
            scene.add(light);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            // ⚠️ PEGA AQUÍ TU ENLACE DIRECTO DE CATBOX:
            const urlAvatar = 'https://files.catbox.moe/1an7hp.vrm'; 

            loader.load(
                urlAvatar,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    if (vrm) {
                        currentVrm = vrm;
                        scene.add(vrm.scene);
                        vrm.scene.rotation.y = Math.PI;

                        // 😊 Sonrisita muy suave para mantener los ojos bien abiertos
                        if (vrm.expressionManager) {
                            vrm.expressionManager.setValue('happy', 0.2);
                            vrm.expressionManager.setValue('blink', 0.0);
                            vrm.expressionManager.update();
                        }

                        // 🌸 Brazos relajados y caídos pegados al cuerpo
                        if (vrm.humanoid) {
                            const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                            const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                            if (leftUpperArm) { leftUpperArm.rotation.z = 1.45; leftUpperArm.rotation.x = 0.0; }
                            if (rightUpperArm) { rightUpperArm.rotation.z = -1.45; rightUpperArm.rotation.x = 0.0; }
                        }
                    }
                },
                (progress) => {},
                (error) => console.error('Error al cargar avatar:', error)
            );

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const deltaTime = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                if (currentVrm) {
                    currentVrm.update(deltaTime);
                    const humanoid = currentVrm.humanoid;

                    if (humanoid) {
                        const chest = humanoid.getNormalizedBoneNode('chest');
                        const head = humanoid.getNormalizedBoneNode('head');

                        if (chest) chest.rotation.x = Math.sin(elapsedTime * 2) * 0.012;
                        if (head) {
                            if (isPensando) {
                                head.rotation.z = 0.12;
                                head.rotation.y = Math.sin(elapsedTime * 2) * 0.08;
                            } else {
                                head.rotation.y = Math.sin(elapsedTime * 0.8) * 0.08;
                                head.rotation.z = Math.sin(elapsedTime * 1.2) * 0.02;
                            }
                        }
                    }
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        async function intentarLogin() {
            const usuario = document.getElementById('userInput').value.trim();
            const password = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!usuario) {
                errorMsg.innerText = "Por favor escribe tu nombre estelar.";
                return;
            }

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, password: password })
                });
                const data = await response.json();
                if (data.status === "OK") {
                    usuarioActual = usuario;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'grid';
                    document.getElementById('displayUserBadge').innerText = `✨ Conectado como: ${usuario}`;
                    
                    // 💌 Saludo seguro y blindado para que nunca falle
                    const saludoFinal = data.saludo || `¡Hola, ${usuario}! 🚂✨ ¡Qué alegría verte llegar de nuevo a la estación estelar! ¿Cómo estuvo tu día? 🌙💛🌿`;
                    
                    const chatBox = document.getElementById('chatBox');
                    chatBox.innerHTML = `<div class="message neil-message">${saludoFinal}</div>`;

                    setTimeout(cargarAvatar3D, 150);
                } else {
                    errorMsg.innerText = data.mensaje || "Credenciales incorrectas.";
                }
            } catch (error) {
                errorMsg.innerText = "Error al conectar con la estación en Render.";
            }
        }

        async function enviarMensaje() {
            const input = document.getElementById('mensajeInput');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="message user-message">${mensaje}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            isPensando = true;
            const pensandoDiv = document.createElement('div');
            pensandoDiv.className = 'message neil-message';
            pensandoDiv.innerText = "Neil Astro: (Pensando entre las estrellas... 🌙✨)";
            chatBox.appendChild(pensandoDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://neil-astro-web.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioActual, mensaje: mensaje })
                });
                const data = await response.json();
                pensandoDiv.remove();

                if (data.respuesta) {
                    const textoFormateado = formatearTextoNeil(data.respuesta);
                    chatBox.innerHTML += `<div class="message neil-message"><strong>Neil Astro:</strong><br>${textoFormateado}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message neil-message">Neil Astro: ¡Ups! El tren se detuvo un momento. 🚂💨</div>`;
                }
            } catch (error) {
                pensandoDiv.remove();
                chatBox.innerHTML += `<div class="message neil-message">Neil Astro: No pude conectar con el servidor estelar. 🥺</div>`;
            }

            isPensando = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('btnLogin').addEventListener('click', intentarLogin);
        document.getElementById('btnEnviar').addEventListener('click', enviarMensaje);
        document.getElementById('mensajeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
